[project]
name = "heartscreen"
version = "0.1.0"
description = "Arrhythmia discovery engine for single-lead wearable ECG"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jax>=0.6",
    "flax>=0.10",
    "optax>=0.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "wfdb>=4.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heartscreen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
